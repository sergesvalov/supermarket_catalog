services:
  backend:
    build: ./backend
    container_name: catalog-backend
    volumes:
      - /opt/supermarket_catalog/backend_data:/app/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/admin/config || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: catalog-frontend
    ports:
      - "8040:5173" # Check: Vite uses 5173 by default
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoid overwriting container's node_modules with local (if any)
    depends_on:
      - backend
