services:
  backend:
    build: ./backend
    container_name: catalog-backend
    volumes:
      - /opt/supermarket_catalog/backend_data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: catalog-frontend
    ports:
      - "8040:80"
    volumes:
      # Mount the nginx config so we can tweak routing without rebuilding
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
